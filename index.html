<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>メンテナンス中 ｜ Rism Japan</title>
<link rel="icon" type="image/png" href="logo.png" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
      "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background: #1A2230;
    color: #F7F4EC;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.8;
    padding: 24px;
  }
  .card { max-width: 560px; }
  .logo { width: 96px; height: auto; margin: 0 auto 32px; opacity: .95; }
  h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: .02em; margin-bottom: 20px; }
  p { color: #A1A8B5; font-size: .95rem; }
  p + p { margin-top: 12px; }
  .rule { width: 40px; height: 2px; background: #4B5563; margin: 28px auto; border: 0; }
  .brand { margin-top: 36px; font-size: .8rem; letter-spacing: .08em; color: #7C8493; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.png" alt="Rism Japan" />
    <h1>ただいまメンテナンス中です</h1>
    <hr class="rule" />
    <p>現在、サイトのリニューアル作業を行っております。</p>
    <p>ご不便をおかけいたしますが、いましばらくお待ちください。</p>
    <p class="brand">Rism Japan</p>
  </main>
</body>
</html>
